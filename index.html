<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <meta name="theme-color" content="#000000" />

  <title>POI AR App</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <!-- Für look-at bei den Labels -->
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <link rel="stylesheet" href="./styles.css" />

  <style>
    /*
      Wichtig für Android:
      AR.js erzeugt ein Video-Element für die Kamera.
      Auf manchen Android-Geräten läuft die Kamera, aber das Video liegt unsichtbar hinter/unter dem Canvas.
      Diese Regeln zwingen das Kameravideo fullscreen in den Hintergrund.
    */

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      opacity: 1 !important;
      visibility: visible !important;
      display: block !important;
      transform: none !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
    }

    canvas.a-canvas {
      background: transparent !important;
    }

    #topbar,
    #poiPanel {
      z-index: 20 !important;
    }
  </style>
</head>

<body>
  <header id="topbar" aria-live="polite">
    <div id="status">
      Starte AR-App...
    </div>

    <button id="permissionButton" type="button">
      Sensoren erlauben
    </button>

    <button id="locateButton" type="button">
      Standort bestimmen
    </button>
  </header>

  <section id="poiPanel" aria-hidden="true">
    <h2 id="poiTitle">POI</h2>
    <p id="poiDescription"></p>
    <p id="poiDistance"></p>

    <button id="closePanel" type="button">
      Schließen
    </button>
  </section>

  <div id="sceneContainer"></div>

  <script>
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;

    const isAndroid = /android/i.test(userAgent);

    const isIOS =
      /iPad|iPhone|iPod/.test(userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    /*
      iPhone:
      Deine funktionierende Variante mit videoTexture.

      Android:
      Ohne videoTexture, damit AR.js ein echtes video-Element hinter die Szene legt.
      Zusätzlich erzwingen wir per CSS, dass dieses Video sichtbar ist.
    */
    const arjsSettings = isAndroid
      ? "sourceType: webcam; debugUIEnabled: false;"
      : "sourceType: webcam; videoTexture: true; debugUIEnabled: false;";

    const sceneContainer = document.querySelector("#sceneContainer");

    sceneContainer.innerHTML = `
      <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="antialias: true; alpha: true"
        arjs="${arjsSettings}"
      >
        <a-camera
          gps-camera
          rotation-reader
          look-controls="touchEnabled: false; mouseEnabled: false"
          wasd-controls="enabled: false"
          cursor="rayOrigin: mouse"
          raycaster="objects: .clickable"
        ></a-camera>
      </a-scene>
    `;

    console.log("Gerät erkannt:", {
      isAndroid,
      isIOS,
      arjsSettings
    });
  </script>

  <script src="./app.js"></script>
</body>
</html>
